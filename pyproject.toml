[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "paperpin"
version = "0.1.0"
description = "Pin every value an LLM extracts from a document to the exact spot on the page it came from, and flag the values that aren't there at all."
dynamic = ["readme"]
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Rjabov" }]
keywords = [
    "ocr", "document-extraction", "grounding", "llm",
    "hallucination-detection", "invoice", "pdf", "document-ai",
    "information-extraction", "bounding-boxes", "verification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing",
]
dependencies = [
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# default recommended install: pip install paperpin[full]
pdf = ["pdfplumber>=0.11"]
# rapidocr brings its own opencv-python; pinning headless too put TWO cv2
# owners in one env (uninstalling either broke the other)
ocr = ["rapidocr-onnxruntime>=1.2"]
heic = ["pillow-heif>=0.13"]
full = [
    "pdfplumber>=0.11",
    "rapidocr-onnxruntime>=1.2",
    "pillow-heif>=0.13",
]
lab = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100",
       "reportlab>=4.0", "httpx>=0.27", "jsonschema>=4.20"]

[project.scripts]
paperpin = "paperpin.cli:main"

[project.urls]
Homepage = "https://github.com/Rjabov/paperpin"
Repository = "https://github.com/Rjabov/paperpin"
Issues = "https://github.com/Rjabov/paperpin/issues"

# GitHub renders the relative image/file links in README.md; PyPI cannot,
# so the long description gets absolute URLs substituted at build time.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="docs/assets/'
replacement = 'src="https://raw.githubusercontent.com/Rjabov/paperpin/main/docs/assets/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((fixtures/|tests/|examples/|CONTRIBUTING\.md|SECURITY\.md|LICENSE)'
replacement = '](https://github.com/Rjabov/paperpin/blob/main/\g<1>'

[tool.hatch.build.targets.wheel]
packages = ["paperpin"]

[tool.hatch.build.targets.sdist]
# explicit allowlist: the default VCS walk shipped .claude worktree files and
# the whole lab/web node tree in the public tarball
include = [
  "paperpin",
  "docs/result.schema.json",
  "tests",
  "fixtures/corpus",
  "fixtures/demo",
  "fixtures/golden",
  "bench",
  "examples",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # layers, applied by tests/conftest.py from one mapping — every test has
    # exactly one, so `pytest -m unit` means something
    "unit: deterministic, hand-built input, no document read from disk",
    "integration: a real document through the pipeline, or the HTTP stack",
    "contract: the published surface — result JSON, CLI I/O, goldens, examples",
    "e2e: graded corpus gates — located rate, IoU, silent-wrong = 0",
    "security: pins a fix whose absence was demonstrated",
    "perf: scaling and work-volume gates",
    # orthogonal
    "slow: OCR-heavy end-to-end tests (degradation matrix)",
]

[tool.coverage.run]
source = ["paperpin"]
branch = true          # a taken `if` with an untaken `else` is not covered

[tool.coverage.paths]
# CI combines data from 12 matrix cells plus the OCR job. Windows records
# backslash paths and the others record forward slashes; without this,
# combine treats them as different files and the totals are nonsense.
source = ["paperpin", "*/paperpin", '*\paperpin']

[tool.coverage.report]
show_missing = true
# The fast suite alone, which is what `pytest --cov` runs locally. CI gates
# on more: it combines every job's data (the OCR job lifts the OCR backend
# from 35% to 75%) and holds the core engine to a separate, higher floor.
# All three ratchet UP as gaps close; lowering one is a decision to argue
# for in a PR, never a quick fix for a red build.
fail_under = 85
exclude_also = [
  "if __name__ == .__main__.:",
]
