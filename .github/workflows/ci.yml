name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[full,lab,dev]"
      - name: Import time sanity (CPU-magic budget)
        # Windows runners pay a cold-filesystem tax on first import;
        # the regression guard still bites at the higher bound.
        run: python -c "import time, os; t=time.perf_counter(); import paperpin; d=time.perf_counter()-t; budget = 6.0 if os.name == 'nt' else 2.5; print(f'import {d:.2f}s (budget {budget}s)'); assert d < budget"
      - name: Fast tests (unit + text-layer e2e)
        run: pytest -q -m "not slow"

  ocr-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[full,lab,dev]"
      - name: Regenerate degraded matrix from committed corpus PDFs
        run: python -c "from pathlib import Path; from bench.degrade import degrade_corpus; degrade_corpus(Path('fixtures/corpus'), Path('fixtures/degraded'))"
      - name: OCR-route gates (degradation tiers, planted fakes)
        run: pytest -q tests/test_degraded_e2e.py

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build artifacts
        run: |
          python -m pip install -U pip build twine check-wheel-contents
          python -m build
          twine check --strict dist/*
          check-wheel-contents dist/*.whl
      - name: Wheel installs clean and runs
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -m paperpin version
          cd /tmp && /tmp/clean/bin/python -c "import paperpin; print(paperpin.__version__)"
